const fmt=n=>{n=String(n||'').replace(/[^0-9.]/g,'');if(!n)return '—';let v=parseFloat(n);if(isNaN(v))return '—';return v.toLocaleString('en-IN')};
const markers={}, layer=L.layerGroup().addTo(map);
let rows=DATA.slice(), sortK='dh', sortAsc=true;
function popup(d){return `<div class="pop"><b>${d.sub||d.type}</b>

function possColor(p){p=(p||'').toUpperCase();return p.includes('PHYSICAL')?'#2a7d2a':p.includes('SYMBOLIC')?'#d62828':'#888';}
function pinFor(d){const c=possColor(d.poss);return L.divIcon({className:'',html:'<div style="width:12px;height:12px;background:'+c+';border:2px solid #fff;border-radius:50%;box-shadow:0 0 3px rgba(0,0,0,.5)"></div>',iconSize:[12,12],iconAnchor:[6,6]});}
function drawMarkers(list){layer.clearLayers();for(const k in markers)delete markers[k];
 list.forEach(d=>{if(d.lat===''||d.lat==null)return;const m=L.marker([d.lat,d.lon],{icon:pinFor(d)}).bindPopup(popup(d));m.addTo(layer);markers[d.id]=m;});}
function renderTable(list){const tb=document.getElementById('tb');tb.innerHTML='';
 list.forEach(d=>{const tr=document.createElement('tr');tr.className='row';tr.dataset.id=d.id;
  tr.innerHTML=`<td><b>${d.dh||'—'}</b></td><td>${d.dm||'—'}</td><td>${d.sub||d.type||''}</td><td>${d.city||''}</td>
   <td>${d.pin||''}</td><td class="rp">${fmt(d.rp)}</td><td>${d.bank||''}</td><td>${d.emdlast||'—'}</td>
   <td><a class="bid" target="_blank" href="https://ibapi.in/sale_info_home.aspx" title="IBAPI portal">IBAPI</a> · <a class="bid" target="_blank" href="${d.url}" title="MSTC">MSTC</a></td>`;
  tr.onclick=e=>{if(e.target.tagName==='A')return;const m=markers[d.id];

   if(m){map.setView(m.getLatLng(),15);m.openPopup();}};
  tb.appendChild(tr);});

function num(v){v=String(v).replace(/[^0-9.]/g,'');let n=parseFloat(v);return isNaN(n)?Infinity:n;}
function apply(){const q=document.getElementById('q').value.toLowerCase();const ft=document.getElementById('ftype').value;const fp=document.getElementById('fposs').value;
 rows=DATA.filter(d=>{const hay=(d.city+' '+d.addr+' '+d.bank+' '+d.sub+' '+d.type+' '+d.pin).toLowerCase();return hay.includes(q)&&(!ft||d.type===ft)&&(!fp||(d.poss||'').toUpperCase().includes(fp));});
 rows.sort((a,b)=>{let x=a[sortK],y=b[sortK];if(['dh','dm','rp','emd','pin'].includes(sortK)){x=num(x);y=num(y);}else{x=String(x).toLowerCase();y=String(y).toLowerCase();}return (x<y?-1:x>y?1:0)*(sortAsc?1:-1);});
 renderTable(rows);drawMarkers(rows);}
document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(sortK===k)sortAsc=!sortAsc;else{sortK=k;sortAsc=true;}apply();});
document.getElementById('q').oninput=apply;document.getElementById('ftype').onchange=apply;document.getElementById('fposs').onchange=apply;
(function(){const types=[...new Set(DATA.map(d=>d.type).filter(Boolean))].sort();const sel=document.getElementById('ftype');types.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});})();
apply();
